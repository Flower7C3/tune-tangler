name: 'Pubspec: apply +build suffix'
description: 'Read MAJOR.MINOR.PATCH from pubspec (strip any +suffix), set version to base+run_number; optionally upload pubspec as an artifact. Does not commit or tag.'
inputs:
  run_number:
    description: 'Integer after + (e.g. github.run_number)'
    required: true
  github_token:
    description: 'Checkout token (use github.token with contents:write for same-job push without artifacts).'
    required: false
    default: ''
  with_artifacts:
    description: 'Upload modified pubspec as artifact; false = working tree only.'
    required: false
    default: 'true'

outputs:
  base:
    description: 'MAJOR.MINOR.PATCH from pubspec before +'
    value: ${{ steps.apply.outputs.base }}
  computed_version:
    description: 'Full version string including +build'
    value: ${{ steps.apply.outputs.computed_version }}
  tag_name:
    description: 'Suggested tag name (v + computed_version)'
    value: ${{ steps.apply.outputs.tag_name }}

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
        token: ${{ inputs.github_token != '' && inputs.github_token || github.token }}

    - name: Set pubspec version to base+build
      id: apply
      shell: bash
      env:
        RUN_NO: ${{ inputs.run_number }}
      run: |
        set -euo pipefail
        cur=$(grep '^version:' pubspec.yaml | head -1 | sed -E 's/^version:[[:space:]]+//; s/[[:space:]]+$//')
        base="${cur%%+*}"
        if ! [[ "$base" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::pubspec version base must be MAJOR.MINOR.PATCH (got base from: ${cur})"
          exit 1
        fi
        VERSION="${base}+${RUN_NO}"
        sed -i.bak -E "s/^version:.*/version: ${VERSION}/" pubspec.yaml
        rm -f pubspec.yaml.bak
        echo "base=${base}" >> "$GITHUB_OUTPUT"
        echo "computed_version=${VERSION}" >> "$GITHUB_OUTPUT"
        echo "tag_name=v${VERSION}" >> "$GITHUB_OUTPUT"
        echo "Set pubspec to ${VERSION} (base ${base} + build ${RUN_NO})"

    - name: Upload pubspec artifact
      if: ${{ inputs.with_artifacts == 'true' }}
      uses: actions/upload-artifact@v7
      with:
        name: modified-pubspec
        path: pubspec.yaml
        retention-days: 1
