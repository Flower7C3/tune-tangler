name: 'Setup Java'
description: 'Setup Java environment for TuneTangler'
inputs:
  java_version:
    description: 'Java version to use'
    required: false
    default: '17'
  java_distribution:
    description: 'Java distribution to use'
    required: false
    default: 'zulu'

runs:
  using: 'composite'
  steps:
    - name: "🔧 Checkout code"
      uses: actions/checkout@v4
        
    - name: "🔧 Setup Java"
      uses: actions/setup-java@v4
      with:
        distribution: ${{ inputs.java_distribution }}
        java-version: ${{ inputs.java_version }}

    # Cache Gradle dependencies for faster builds
    - name: "📦 Cache Gradle dependencies"
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
          ~/.gradle/daemon
        key: gradle-${{ runner.os }}-${{ inputs.java_version }}-${{ inputs.java_distribution }}-${{ hashFiles('**/gradle-wrapper.properties') }}
        restore-keys: |
          gradle-${{ runner.os }}-${{ inputs.java_version }}-${{ inputs.java_distribution }}-
          gradle-${{ runner.os }}-${{ inputs.java_version }}-
          gradle-${{ runner.os }}-