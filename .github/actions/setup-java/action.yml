name: 'Setup Java'
description: 'JDK for Android (Gradle cache). Caller must run actions/checkout before this action.'
inputs:
  java_version:
    description: 'Java version to use'
    required: false
    default: '17'
  java_distribution:
    description: 'Java distribution to use'
    required: false
    default: 'zulu'

runs:
  using: 'composite'
  steps:
    - name: "🔧 Setup Java"
      uses: actions/setup-java@v5
      with:
        distribution: ${{ inputs.java_distribution }}
        java-version: ${{ inputs.java_version }}
        cache: 'gradle'
        cache-dependency-path: |
          **/gradle-wrapper.properties
          **/build.gradle
          **/build.gradle.kts