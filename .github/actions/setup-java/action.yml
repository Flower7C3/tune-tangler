name: 'Setup Java'
description: 'JDK for Android; optional checkout (skip_checkout if repo already checked out).'
inputs:
  skip_checkout:
    description: 'Skip actions/checkout (caller already checked out).'
    required: false
    default: 'false'
  java_version:
    description: 'Java version to use'
    required: false
    default: '17'
  java_distribution:
    description: 'Java distribution to use'
    required: false
    default: 'zulu'

runs:
  using: 'composite'
  steps:
    - name: "🔧 Checkout code"
      if: ${{ inputs.skip_checkout != 'true' }}
      uses: actions/checkout@v6

    - name: "🔧 Setup Java"
      uses: actions/setup-java@v5
      with:
        distribution: ${{ inputs.java_distribution }}
        java-version: ${{ inputs.java_version }}
        cache: 'gradle'
        cache-dependency-path: |
          **/gradle-wrapper.properties
          **/build.gradle
          **/build.gradle.kts