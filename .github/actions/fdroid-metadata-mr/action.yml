name: 'F-Droid metadata MR'
description: 'Checkout ref, run tools/fdroid/publish_fdroid_mr.py (GitLab MR to fdroiddata).'

inputs:
  commit_sha:
    description: 'Full 40-char commit SHA for Builds[].commit and validation'
    required: true
  ref_name:
    description: 'Git ref to checkout (branch or tag, e.g. main or v1.2.3)'
    required: true
  version_override:
    description: 'Optional MAJOR.MINOR.PATCH or MAJOR.MINOR.PATCH+code (empty uses tag / pubspec)'
    required: false
    default: ''
  flutter_version:
    description: 'Pin Flutter for the F-Droid recipe (e.g. from vars.FDROID_FLUTTER_VERSION in the caller workflow). Empty = latest stable from Flutter JSON.'
    required: false
    default: ''
  metadata_source_branch:
    description: >-
      GitLab fork branch for metadata commits and MR source (publish_fdroid_mr.py). Pass
      vars.FDROID_METADATA_SOURCE_BRANCH from the workflow; empty = robot/tune-tangler.
    required: false
    default: ''

# GitLab: set on the *caller job* as env, e.g.
#   env:
#     GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
#     GITLAB_FORK_PROJECT_ID: ${{ vars.GITLAB_FORK_PROJECT_ID }}
# (token = secret; fork project ID = repository variable — not sensitive.)

runs:
  using: composite
  steps:
    - name: "🔧 Checkout code"
      uses: actions/checkout@v6
      with:
        ref: ${{ inputs.ref_name }}
        fetch-depth: 1

    - name: "🐍 Setup Python"
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: "📦 PyYAML"
      shell: bash
      run: pip install pyyaml

    - name: "📌 Flutter version for metadata recipe"
      shell: bash
      env:
        PINNED_FLUTTER: ${{ inputs.flutter_version }}
      run: |
        set -euo pipefail
        V="${PINNED_FLUTTER:-}"
        if [ -z "${V:-}" ]; then
          V=$(curl -fsSL "https://storage.googleapis.com/flutter_infra_release/releases/releases_linux.json" \
            | jq -r '.releases[] | select(.channel=="stable") | .version' | head -1)
        fi
        echo "FDROID_FLUTTER_VERSION=$V" >> "$GITHUB_ENV"
        echo "Using Flutter $V in F-Droid build recipe"

    - name: "🔐 Validate GitLab secrets"
      shell: bash
      run: |
        set -euo pipefail
        if [ -z "${GITLAB_TOKEN:-}" ]; then
          echo "::error::GITLAB_TOKEN is unset or empty. Define it on the workflow job as env from secrets (see docs/release/FDROID.md — \"Secrets not visible in CI\")."
          exit 1
        fi
        if [ -z "${GITLAB_FORK_PROJECT_ID:-}" ]; then
          echo "::error::GITLAB_FORK_PROJECT_ID is unset or empty. Set a repository **variable** GITLAB_FORK_PROJECT_ID (Actions → Variables) and pass it as job env (numeric GitLab project ID)."
          exit 1
        fi

    - name: "📝 VERSION_OVERRIDE"
      shell: bash
      env:
        VO: ${{ inputs.version_override }}
      run: echo "VERSION_OVERRIDE=$VO" >> "$GITHUB_ENV"

    - name: "🚀 Publish metadata + MR"
      shell: bash
      env:
        GITLAB_UPSTREAM_PATH: fdroid/fdroiddata
        FDROID_METADATA_PATH: metadata/pro.kwiatek.tune_tangler.yml
        GITHUB_SHA: ${{ inputs.commit_sha }}
        GITHUB_REF_NAME: ${{ inputs.ref_name }}
        FDROID_FLUTTER_VERSION: ${{ env.FDROID_FLUTTER_VERSION }}
        FDROID_METADATA_SOURCE_BRANCH: ${{ inputs.metadata_source_branch }}
      run: python3 tools/fdroid/publish_fdroid_mr.py
