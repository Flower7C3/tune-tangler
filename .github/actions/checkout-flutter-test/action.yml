name: 'Checkout + Flutter + tests'
description: 'Checkout (unless skip_checkout), Flutter, deps, analyzer and tests.'
inputs:
  skip_checkout:
    description: 'Skip actions/checkout (caller must checkout first).'
    required: false
    default: 'false'
  fetch_depth:
    description: 'fetch-depth when checkout runs (ignored if skip_checkout).'
    required: false
    default: '1'
  flutter_version:
    description: 'Pin Flutter SDK version (empty = resolve from channel JSON)'
    required: false
    default: ''
  flutter_channel:
    description: 'Flutter channel'
    required: false
    default: 'stable'
  with_dependencies:
    description: 'Run flutter pub get'
    required: false
    default: 'true'
  with_localization:
    description: 'Run flutter gen-l10n'
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Checkout
      if: ${{ inputs.skip_checkout != 'true' }}
      uses: actions/checkout@v6
      with:
        fetch-depth: ${{ fromJSON(inputs.fetch_depth) }}

    - name: Setup Flutter
      uses: ./.github/actions/setup-flutter
      with:
        skip_checkout: 'true'
        flutter_version: ${{ inputs.flutter_version }}
        flutter_channel: ${{ inputs.flutter_channel }}
        with_dependencies: ${{ inputs.with_dependencies }}
        with_localization: ${{ inputs.with_localization }}

    - name: Run tests
      uses: ./.github/actions/flutter-test
