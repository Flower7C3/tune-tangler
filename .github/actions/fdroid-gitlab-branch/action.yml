name: 'F-Droid GitLab branch'
description: >-
  Checkout release ref, run tools/fdroid/publish_fdroid_gitlab_branch.py to push metadata YAML to a
  versioned branch on your fdroiddata fork (branch only; no merge request). Exposes gitlab_tree_url for the job summary.

inputs:
  commit_sha:
    description: 'Full 40-char commit SHA for Builds[].commit and validation'
    required: true
  ref_name:
    description: 'Git ref to checkout (branch or tag, e.g. main or v1.2.3)'
    required: true
  version_override:
    description: 'Optional MAJOR.MINOR.PATCH or MAJOR.MINOR.PATCH+code (empty uses tag / pubspec)'
    required: false
    default: ''
  flutter_version:
    description: 'Pin Flutter for the F-Droid recipe (e.g. from vars.FDROID_FLUTTER_VERSION in the caller workflow). Empty = latest stable from Flutter JSON.'
    required: false
    default: ''
  robot_branch_prefix:
    description: >-
      Prefix for auto branch name: prefix-versionName-versionCode. Pass vars.FDROID_ROBOT_BRANCH_PREFIX;
      empty = robot/tune-tangler.
    required: false
    default: ''
  gitlab_branch:
    description: >-
      Optional full Git branch name on the fork (overrides auto naming). Pass vars.FDROID_GITLAB_BRANCH when set.
    required: false
    default: ''

# GitLab: set on the *caller job* as env, e.g.
#   env:
#     GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
#     GITLAB_FORK_PROJECT_ID: ${{ vars.GITLAB_FORK_PROJECT_ID }}
# (token = secret; fork project ID = repository variable — not sensitive.)

outputs:
  gitlab_tree_url:
    description: 'HTTPS URL to the fork branch tree (CI / pipelines)'
    value: ${{ steps.publish.outputs.gitlab_tree_url }}
  gitlab_branch:
    description: 'Git branch name created or updated on the fork'
    value: ${{ steps.publish.outputs.gitlab_branch }}

runs:
  using: composite
  steps:
    - name: "🔧 Checkout code"
      uses: actions/checkout@v6
      with:
        ref: ${{ inputs.ref_name }}
        fetch-depth: 1

    # Release tags predate workflow changes; run the fdroiddata branch publisher from the default branch.
    - name: "📌 publish_fdroid_gitlab_branch.py from default branch"
      shell: bash
      env:
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
      run: |
        set -euo pipefail
        DB="${DEFAULT_BRANCH}"
        git fetch --depth=1 origin "$DB"
        git checkout FETCH_HEAD -- tools/fdroid/publish_fdroid_gitlab_branch.py
        echo "Using \`tools/fdroid/publish_fdroid_gitlab_branch.py\` from \`origin/${DB}\` (app tree still \`${{ inputs.ref_name }}\`)." >> "$GITHUB_STEP_SUMMARY"

    - name: "🐍 Setup Python"
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: "📦 PyYAML"
      shell: bash
      run: pip install pyyaml

    - name: "📌 Flutter version for metadata recipe"
      shell: bash
      env:
        PINNED_FLUTTER: ${{ inputs.flutter_version }}
      run: |
        set -euo pipefail
        V="${PINNED_FLUTTER:-}"
        if [ -z "${V:-}" ]; then
          V=$(curl -fsSL "https://storage.googleapis.com/flutter_infra_release/releases/releases_linux.json" \
            | jq -r '.releases[] | select(.channel=="stable") | .version' | head -1)
        fi
        echo "FDROID_FLUTTER_VERSION=$V" >> "$GITHUB_ENV"
        echo "Using Flutter $V in F-Droid build recipe"

    - name: "🔐 Validate GitLab secrets"
      shell: bash
      run: |
        set -euo pipefail
        if [ -z "${GITLAB_TOKEN:-}" ]; then
          echo "::error::GITLAB_TOKEN is unset or empty. Define it on the workflow job as env from secrets (see docs/release/FDROID.md — \"Secrets not visible in CI\")."
          exit 1
        fi
        if [ -z "${GITLAB_FORK_PROJECT_ID:-}" ]; then
          echo "::error::GITLAB_FORK_PROJECT_ID is unset or empty. Set a repository **variable** GITLAB_FORK_PROJECT_ID (Actions → Variables) and pass it as job env (numeric GitLab project ID)."
          exit 1
        fi

    - name: "📝 VERSION_OVERRIDE"
      shell: bash
      env:
        VO: ${{ inputs.version_override }}
      run: echo "VERSION_OVERRIDE=$VO" >> "$GITHUB_ENV"

    - name: "🚀 Push fdroiddata fork branch"
      id: publish
      shell: bash
      env:
        FDROID_METADATA_PATH: metadata/pro.kwiatek.tune_tangler.yml
        GITHUB_SHA: ${{ inputs.commit_sha }}
        GITHUB_REF_NAME: ${{ inputs.ref_name }}
        FDROID_FLUTTER_VERSION: ${{ env.FDROID_FLUTTER_VERSION }}
        FDROID_ROBOT_BRANCH_PREFIX: ${{ inputs.robot_branch_prefix }}
        FDROID_GITLAB_BRANCH: ${{ inputs.gitlab_branch }}
      run: python3 tools/fdroid/publish_fdroid_gitlab_branch.py
