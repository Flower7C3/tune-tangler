name: 'Pubspec version bump, commit, push, and tag'
description: >-
  After tests pass on main: bump pubspec version (+GITHUB_RUN_NUMBER), optionally PATCH bump,
  commit with [skip ci], push branch, create and push annotated tag. Pass before_sha from the
  parent push event and commit message prefix for your project conventions.

inputs:
  checkout_token:
    description: 'Token for checkout and push (use github.token from the workflow)'
    required: true
  before_sha:
    description: 'github.event.before for push (may be empty for workflow_dispatch or new branch)'
    required: false
    default: ''
  commit_suffix:
    description: 'Appended to the version bump commit message (include leading space if needed)'
    required: false
    default: ' [skip ci]'
  version_commit_prefix:
    description: 'Commit message prefix before the version (e.g. "chore: release ")'
    required: false
    default: 'chore: release '
  annotated_tag_message_template:
    description: 'When annotate_with_body is true, git tag -m uses this plus tag; otherwise empty message'
    required: false
    default: 'Release '
  annotate_with_body:
    description: 'If true, annotated tag includes a message; if false, git tag -m ""'
    required: false
    default: 'false'
  pubspec_path:
    description: 'Path to pubspec.yaml relative to the repository root'
    required: false
    default: 'pubspec.yaml'

runs:
  using: composite
  steps:
    - name: '🔧 Checkout code'
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
        token: ${{ inputs.checkout_token }}

    - name: '👤 Configure Git identity'
      uses: ./.github/actions/git-config-github-actions-bot

    - name: '📈 Set version (PATCH bump or normalize) + build suffix'
      id: bump
      shell: bash
      env:
        BEFORE: ${{ inputs.before_sha }}
        RUN_NO: ${{ github.run_number }}
        PUBSPEC: ${{ inputs.pubspec_path }}
      run: |
        set -euo pipefail
        echo "do_tag=false" >> "$GITHUB_OUTPUT"
        BEFORE_EFFECTIVE="${BEFORE:-}"
        if [ -z "$BEFORE_EFFECTIVE" ] || [ "$BEFORE_EFFECTIVE" = "0000000000000000000000000000000000000000" ]; then
          if [ "${GITHUB_EVENT_NAME:-}" = "workflow_dispatch" ]; then
            BEFORE_EFFECTIVE=$(git rev-parse HEAD^ 2>/dev/null || true)
          fi
        fi
        if [ -z "$BEFORE_EFFECTIVE" ] || [ "$BEFORE_EFFECTIVE" = "0000000000000000000000000000000000000000" ]; then
          echo "No usable before-SHA; skip."
          exit 0
        fi
        if ! git cat-file -e "${BEFORE_EFFECTIVE}^{commit}" 2>/dev/null; then
          echo "before SHA not found; skip."
          exit 0
        fi
        cur=$(grep '^version:' "$PUBSPEC" | head -1 | sed -E 's/^version:[[:space:]]+//; s/[[:space:]]+$//')
        if git diff "$BEFORE_EFFECTIVE" "${GITHUB_SHA}" -- "$PUBSPEC" | grep -E '^[+-]version:' >/dev/null; then
          echo "pubspec version: line changed in this push — set base+build only (no PATCH bump)."
          base="${cur%%+*}"
        else
          echo "pubspec version: unchanged in push diff — bump PATCH, then +build."
          base="${cur%%+*}"
          if ! [[ "$base" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::pubspec version base must be MAJOR.MINOR.PATCH (got: ${cur})"
            exit 1
          fi
          IFS=. read -r MAJOR MINOR PATCH <<< "$base"
          PATCH=$((PATCH + 1))
          base="${MAJOR}.${MINOR}.${PATCH}"
        fi
        if ! [[ "$base" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::pubspec version base must be MAJOR.MINOR.PATCH (got base from: ${cur})"
          exit 1
        fi
        NEW="${base}+${RUN_NO}"
        if [ "$cur" = "$NEW" ]; then
          echo "pubspec already ${NEW}; nothing to commit."
          exit 0
        fi
        sed -i.bak -E "s/^version:.*/version: ${NEW}/" "$PUBSPEC"
        rm -f "${PUBSPEC}.bak"
        if git diff --quiet "$PUBSPEC"; then
          echo "No pubspec change; exit."
          exit 0
        fi
        echo "do_tag=true" >> "$GITHUB_OUTPUT"

    - name: '🏷️ Expect changed pubspec'
      if: steps.bump.outputs.do_tag == 'true'
      shell: bash
      env:
        PUBSPEC: ${{ inputs.pubspec_path }}
      run: |
        set -euo pipefail
        if ! git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
          echo "::error::This step requires an existing git checkout."
          exit 1
        fi
        if git diff --quiet -- "$PUBSPEC"; then
          echo "::error::pubspec is unchanged. Modify pubspec before commit."
          exit 1
        fi

    - name: '🏷️ Detect pubspec version for tag'
      id: pubspec
      if: steps.bump.outputs.do_tag == 'true'
      shell: bash
      env:
        PUBSPEC: ${{ inputs.pubspec_path }}
      run: |
        set -euo pipefail
        VERSION=$(grep '^version:' "$PUBSPEC" | head -1 | sed -E 's/^version:[[:space:]]+//; s/[[:space:]]+$//')
        TAG="v${VERSION}"
        echo "VERSION=$VERSION" >> "$GITHUB_ENV"
        echo "TAG=$TAG" >> "$GITHUB_ENV"
        if git diff --quiet "$PUBSPEC"; then
          echo "changed=false" >> "$GITHUB_OUTPUT"
        else
          echo "changed=true" >> "$GITHUB_OUTPUT"
        fi

    - name: '🏷️ Commit pubspec'
      if: ${{ steps.bump.outputs.do_tag == 'true' && steps.pubspec.outputs.changed == 'true' }}
      shell: bash
      env:
        COMMIT_SUFFIX: ${{ inputs.commit_suffix }}
        VERSION_PREFIX: ${{ inputs.version_commit_prefix }}
        PUBSPEC: ${{ inputs.pubspec_path }}
      run: |
        set -euo pipefail
        git add "$PUBSPEC"
        git commit -m "${VERSION_PREFIX}${VERSION}${COMMIT_SUFFIX}"

    - name: '🏷️ Push branch'
      if: steps.bump.outputs.do_tag == 'true'
      shell: bash
      run: |
        set -euo pipefail
        git push origin "HEAD:${GITHUB_REF_NAME}"

    - name: '🏷️ Annotated tag and push tag'
      if: steps.bump.outputs.do_tag == 'true'
      shell: bash
      env:
        ANNOTATE_BODY: ${{ inputs.annotate_with_body }}
        TAG_MSG_PREFIX: ${{ inputs.annotated_tag_message_template }}
      run: |
        set -euo pipefail
        if git rev-parse "$TAG" >/dev/null 2>&1; then
          echo "::error::Tag ${TAG} already exists locally."
          exit 1
        fi
        if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q .; then
          echo "::error::Tag ${TAG} already exists on origin."
          exit 1
        fi
        if [ "$ANNOTATE_BODY" = "true" ]; then
          git tag -a "$TAG" -m "${TAG_MSG_PREFIX}${TAG}"
        else
          git tag -a "$TAG" -m ""
        fi
        git push origin "$TAG"
