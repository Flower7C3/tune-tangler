name: 'Setup Flutter'
description: 'Setup Flutter environment for TuneTangler'
inputs:
  flutter_version:
    description: 'Flutter version to use (if not provided, will fetch latest stable)'
    required: false
    default: ''
  flutter_channel:
    description: 'Flutter channel to use'
    required: false
    default: 'stable'
  with_dependencies:
    description: 'Get Flutter dependencies'
    required: false
    default: 'true'
  with_localization:
    description: 'Generate localization files'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: "📲 Get Flutter version"
      id: get_flutter_version
      shell: bash
      run: |
        if [ -n "${{ inputs.flutter_version }}" ]; then
          echo "version=${{ inputs.flutter_version }}" >> $GITHUB_OUTPUT
          echo "Using provided Flutter version: ${{ inputs.flutter_version }}"
        else
          # Get the latest stable Flutter version
          FLUTTER_VERSION=$(curl -s https://storage.googleapis.com/flutter_infra_release/releases/releases_linux.json | jq -r '.releases[] | select(.channel=="${{ inputs.flutter_channel }}") | .version' | head -1)
          echo "version=$FLUTTER_VERSION" >> $GITHUB_OUTPUT
          echo "Using latest ${{ inputs.flutter_channel }} Flutter version: $FLUTTER_VERSION"
        fi
      
    - name: "🔧 Setup Flutter"
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ steps.get_flutter_version.outputs.version }}
        channel: ${{ inputs.flutter_channel }}
        cache: true
        cache-key: flutter-${{ runner.os }}-${{ steps.get_flutter_version.outputs.version }}-${{ inputs.flutter_channel }}
        
    - name: "📦 Get dependencies"
      if: ${{ inputs.with_dependencies == 'true' }}
      shell: bash
      run: flutter pub get
      
    - name: "🌐 Generate localization files"
      if: ${{ inputs.with_localization == 'true' }}
      shell: bash
      run: flutter gen-l10n

    # Cache Flutter dependencies
    - name: "📦 Cache Flutter dependencies"
      uses: actions/cache@v5
      with:
        path: |
          ~/.pub-cache
          .dart_tool
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: flutter-${{ runner.os }}-${{ inputs.flutter_version }}-${{ hashFiles('**/pubspec.lock') }}
        restore-keys: |
          flutter-${{ runner.os }}-${{ inputs.flutter_version }}-
          flutter-${{ runner.os }}-