# Analyzer + tests on pull requests (and manual run). Push to `main` is covered by `version-tag-main.yml` (tests there before version/tag).
# `env` and paths-ignore: keep in sync with `version-tag-main.yml`.
name: Test Workflow

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '.idea/**'
      - '.vscode/**'
      - '*.iml'
      - '.githooks/**'
      - '.github/**'
      - '.markdownlint.json'
      - '.metadata'
      - 'analysis_options.yaml'
      - 'devtools_options.yaml'
      - 'l10n.yaml'
      - 'docs/**'
      - 'assets/png/**'
      - 'assets/svg/**'
      - 'fastlane/metadata/**'
      - 'LICENSE'
      - 'README.md'
      - 'AGENTS.md'
      - 'missing_translations.txt'
      - 'ios/**'
      - 'linux/**'
      - 'macos/**'
      - 'windows/**'
      - 'tools/**'
      - 'Makefile'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_CHANNEL: 'stable'

jobs:
  test:
    name: "🧪 Test"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: "🔧 Checkout code"
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: "🧪 Flutter setup and tests"
        uses: ./.github/actions/checkout-flutter-test
        with:
          skip_checkout: 'true'
          flutter_channel: ${{ env.FLUTTER_CHANNEL }}
          with_dependencies: 'true'
          with_localization: 'false'
