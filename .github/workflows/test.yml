name: Test Workflow

on:
  pull_request:
    branches: [main]
    paths-ignore: &paths-ignore
      - '.idea/**'
      - '.vscode/**'
      - '*.iml'
      - '.githooks/**'
      - '.github/**'
      - '.markdownlint.json'
      - '.metadata'
      - 'analysis_options.yaml'
      - 'devtools_options.yaml'
      - 'l10n.yaml'
      - 'docs/**'
      - 'assets/png/**'
      - 'assets/svg/**'
      - 'fastlane/metadata/**'
      - 'LICENSE'
      - 'README.md'
      - 'AGENTS.md'
      - 'missing_translations.txt'
      - 'ios/**'
      - 'linux/**'
      - 'macos/**'
      - 'windows/**'
      - 'tools/**'
      - 'Makefile'
  push:
    branches: [main]
    paths-ignore: *paths-ignore
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_CHANNEL: 'stable'
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'zulu'

jobs:
  test:
    name: "🧪 Test"
    runs-on: ubuntu-latest
    steps:
      - name: "🔧 Checkout"
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: "🧪 Flutter setup and tests"
        uses: ./.github/actions/checkout-flutter-test
        with:
          skip_checkout: 'true'
          flutter_channel: ${{ env.FLUTTER_CHANNEL }}
          with_dependencies: 'true'
          with_localization: 'false'
