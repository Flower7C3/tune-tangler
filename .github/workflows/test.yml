name: Test Workflow

on:
  pull_request:
    branches: [ main ]
    paths-ignore:
      # IDE and editor configuration
      - '.idea/**'
      - '.vscode/**'
      - '*.iml'
      # CI/CD and git tooling
      - '.githooks/**'
      - '.github/**'
      # Linter and metadata config
      - '.markdownlint.json'
      - '.metadata'
      - 'devtools_options.yaml'
      # Documentation and assets not affecting the build
      - 'docs/**'
      - 'assets/png/**'          # source logos for icon generation
      - 'assets/svg/**'          # source SVGs for icon generation
      - 'assets/screenshots/**'  # Google Play screenshots
      - 'LICENSE'
      - 'README.md'
      - 'missing_translations.txt'
      # Platforms not built in this workflow (Android only)
      - 'ios/**'
      - 'linux/**'
      - 'macos/**'
      - 'windows/**'
      # Dev tooling
      - 'Makefile'

# Version variables for dependencies
env:
  FLUTTER_CHANNEL: 'stable'
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'zulu'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: "🔧 Checkout code"
        uses: actions/checkout@v4

      - name: "📲 Setup Flutter"
        uses: ./.github/actions/setup-flutter
        with:
          flutter_channel: ${{ env.FLUTTER_CHANNEL }}
          with_dependencies: true
          with_localization: false

      - name: "🧪 Run tests"
        uses: ./.github/actions/flutter-test
