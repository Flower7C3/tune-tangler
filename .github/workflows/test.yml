# Analyzer + tests on pull requests (manual run) and when called from `version-tag-main.yml` on push to `main`.
# `env` and paths-ignore: keep in sync with `version-tag-main.yml`.
name: Test Workflow

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '.idea/**'
      - '.vscode/**'
      - '*.iml'
      - '.githooks/**'
      - '.github/**'
      - '.markdownlint.json'
      - '.metadata'
      - 'analysis_options.yaml'
      - 'devtools_options.yaml'
      - 'l10n.yaml'
      - 'docs/**'
      - 'assets/png/**'
      - 'assets/svg/**'
      - 'fastlane/metadata/**'
      - 'LICENSE'
      - 'README.md'
      - 'AGENTS.md'
      - 'missing_translations.txt'
      - 'tools/**'
      - 'Makefile'
  workflow_dispatch:
  workflow_call:

# Avoid deadlock when called via `workflow_call`: `github.workflow` in a reusable workflow can match the
# caller's name, duplicating the parent's concurrency group (see actions/runner#3205).
concurrency:
  group: >-
    ${{
      github.event_name == 'workflow_call'
      && format('test-reuse-{0}-{1}', github.run_id, github.run_attempt)
      || format('test-{0}', github.event.pull_request.number || github.ref)
    }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_CHANNEL: 'stable'

jobs:
  test:
    name: "🧪 Test"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: "🔧 Checkout code"
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter
        with:
          flutter_channel: ${{ env.FLUTTER_CHANNEL }}
          with_dependencies: true
          with_localization: false

      - name: Run tests
        uses: ./.github/actions/flutter-test
