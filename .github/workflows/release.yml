name: Release Workflow

on:
  push:
    branches: [ master ]
    tags:
      - 'v*'  # Trigger on version tags (e.g., v1.1.4)
  workflow_dispatch:  # Allow manual trigger

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_only: ${{ steps.version.outputs.version_only }}
      tag: ${{ steps.version.outputs.version_only }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
        
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.1'
          channel: 'stable'
          
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'
          
      - name: Verify Java setup
        run: |
          echo "Java version:"
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          echo "Java location:"
          which java
          
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
          key: ${{ runner.os }}-deps-${{ hashFiles('**/pubspec.lock', '**/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-deps-
            
      - name: Get dependencies
        run: flutter pub get
        
      - name: Analyze code
        run: flutter analyze
        
      - name: Run tests
        run: flutter test
        
      - name: Generate localization files
        run: flutter gen-l10n
        
      - name: Increment version before build
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/.*version: //')
          VERSION_ONLY=$(echo $VERSION | sed 's/+.*//')
          BUILD_NUM=$(echo $VERSION | sed 's/.*+//')
          
          # Split version into major.minor.patch
          MAJOR=$(echo $VERSION_ONLY | cut -d. -f1)
          MINOR=$(echo $VERSION_ONLY | cut -d. -f2)
          PATCH=$(echo $VERSION_ONLY | cut -d. -f3)
          
          # Increment both patch and build
          NEW_PATCH=$((PATCH + 1))
          NEW_BUILD_NUM=$((BUILD_NUM + 1))
          NEW_VERSION_ONLY="$MAJOR.$MINOR.$NEW_PATCH"
          NEW_VERSION="$NEW_VERSION_ONLY+$NEW_BUILD_NUM"
          
          echo "Current version: $VERSION"
          echo "New version: $NEW_VERSION (patch: $PATCH->$NEW_PATCH, build: $BUILD_NUM->$NEW_BUILD_NUM)"
          
          # Update pubspec.yaml
          sed -i "s/^version: .*/version: $NEW_VERSION/" pubspec.yaml
          
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "version_only=$NEW_VERSION_ONLY" >> $GITHUB_OUTPUT
          echo "build_num=$NEW_BUILD_NUM" >> $GITHUB_OUTPUT
          
      - name: Debug environment before build
        run: |
          echo "=== Environment Debug ==="
          echo "Flutter version:"
          flutter --version
          echo "Java version:"
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          echo "Gradle version:"
          cd android && ./gradlew --version
          cd ..
          echo "========================"
          
      - name: Build APK Release
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          
      - name: Commit version update
        if: github.ref == 'refs/heads/master'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add pubspec.yaml
          git commit -m "chore: increment version to ${{ steps.version.outputs.version }} [skip ci]" || echo "No changes to commit"

      - name: Check if tag exists
        id: check-tag
        run: |
          if git rev-parse "v${{ steps.version.outputs.version_only }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
          
      - name: Create and push tag
        if: steps.check-tag.outputs.exists == 'false' && github.ref == 'refs/heads/master'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git tag "v${{ steps.version.outputs.version_only }}"
          git push origin "v${{ steps.version.outputs.version_only }}"
          echo "Created and pushed tag v${{ steps.version.outputs.version_only }}"
          
      - name: Tag already exists
        if: steps.check-tag.outputs.exists == 'true'
        run: |
          echo "Tag v${{ steps.version.outputs.version_only }} already exists, skipping"
          
  create-release:
    needs: verify-and-build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: app-release
          path: ./apk          

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.verify-and-build.outputs.version_only }}
          name: Release ${{ needs.verify-and-build.outputs.version }}
          body: |
            ## Release ${{ needs.verify-and-build.outputs.version }}
            
            ### 🚀 What's New
            ${{ github.event.head_commit.message }}
            
            ### 📱 Download
            APK file is attached to this release.
            
            ### 🔧 Build Info
            - Flutter: 3.35.1
            - Build: ${{ github.run_number }}
            - Date: ${{ github.event.head_commit.timestamp }}
          files: ./apk/*.apk
          draft: false
          prerelease: false
