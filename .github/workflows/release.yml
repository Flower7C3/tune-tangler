name: Build & Release Workflow

on:
  workflow_dispatch:  # Only manual trigger - no automatic runs

permissions:
  contents: write
  pull-requests: write

# Version variables for dependencies
env:
  FLUTTER_VERSION: '3.35.1'
  FLUTTER_CHANNEL: 'stable'
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'zulu'

jobs:

  # STEP 1: Test
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: "🔧 Checkout code"
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: "📲 Setup Flutter"
        uses: ./.github/actions/setup-flutter
        with:
          flutter_version: ${{ env.FLUTTER_VERSION }}
          flutter_channel: ${{ env.FLUTTER_CHANNEL }}
          with_dependencies: true
          with_localization: false

      - name: "🧪 Run tests"
        uses: ./.github/actions/flutter-test
  
  # STEP 2: Build
  build:
    name: Build
    needs: [ test ]
    runs-on: ubuntu-latest
    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag_name: ${{ steps.version.outputs.tag_name }}

    steps:
      - name: "🔧 Checkout code"
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: "📲 Setup Flutter"
        uses: ./.github/actions/setup-flutter
        with:
          flutter_version: ${{ env.FLUTTER_VERSION }}
          flutter_channel: ${{ env.FLUTTER_CHANNEL }}
          with_dependencies: true
          with_localization: true

      - name: "☕️ Setup Java"
        uses: ./.github/actions/setup-java
        with:
          java_version: ${{ env.JAVA_VERSION }}
          java_distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: "🔐 Setup Keystore"
        run: |
          # Create keystore from base64 encoded secret
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/tune-tangler-release-key.jks
          echo "✅ Keystore created from secret"

      - name: "🔑 Setup Keystore Credentials"
        run: |
          # Create local.properties with keystore credentials
          cat > android/local.properties << EOF
          # Keystore properties for CI/CD build
          KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS=${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}
          EOF
          echo "✅ Local properties created with keystore credentials"

      - name: "🏷️ Increment version"
        id: version
        run: |
          CURRENT_VERSION=$(grep '^version:' pubspec.yaml | sed 's/.*version: //')
          echo "Current version: $CURRENT_VERSION"

          # Split version into major.minor.patch
          CURRENT_SEMANTIC_VERSION=$(echo $CURRENT_VERSION | sed 's/+.*//')
          CURRENT_MAJOR=$(echo $CURRENT_SEMANTIC_VERSION | cut -d. -f1)
          CURRENT_MINOR=$(echo $CURRENT_SEMANTIC_VERSION | cut -d. -f2)
          CURRENT_PATCH=$(echo $CURRENT_SEMANTIC_VERSION | cut -d. -f3)
          CURRENT_BUILD=$(echo $CURRENT_VERSION | sed 's/.*+//')          
          
          # Increment both patch and build
          NEW_MAJOR=$CURRENT_MAJOR
          NEW_MINOR=$CURRENT_MINOR
          NEW_PATCH=$((CURRENT_PATCH + 1))
          NEW_BUILD=$((CURRENT_BUILD + 1))

          # Create new version
          NEW_SEMANTIC_VERSION="$NEW_MAJOR.$NEW_MINOR.$NEW_PATCH"
          NEW_VERSION="$NEW_SEMANTIC_VERSION+$NEW_BUILD"
          TAG_NAME="v$NEW_SEMANTIC_VERSION"

          echo "New version: $NEW_VERSION"
          echo "Tag name: $TAG_NAME"

          # Output new version
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: "📝 Update pubspec.yaml"
        run: |
          sed -i "s/^version: .*/version: ${{ steps.version.outputs.version }}/" pubspec.yaml
          
      # Build app bundle with optimizations
      - name: "🏗️ Build App Bundle"
        run: |
          # Enable Gradle daemon for faster builds
          export GRADLE_OPTS="-Dorg.gradle.daemon=true -Dorg.gradle.parallel=true -Dorg.gradle.jvmargs=-Xmx4g"
          flutter build appbundle --release --dart-define=FLUTTER_BUILD_NUMBER=$NEW_BUILD

      # Verify app bundle signature
      - name: "🔐 Verify build"
        run: |
          # Verify app bundle signature
          echo "🔍 Verifying app bundle signature..."
          
          # Check if app bundle exists
          if [ ! -f "build/app/outputs/bundle/release/app-release.aab" ]; then
            echo "❌ App bundle not found!"
            exit 1
          fi
          
          # Verify signature with jarsigner
          jarsigner -verify -verbose -certs build/app/outputs/bundle/release/app-release.aab
          
          if [ $? -eq 0 ]; then
            echo "✅ App bundle signature verified successfully!"
          else
            echo "❌ App bundle signature verification failed!"
            exit 1
          fi
          
          echo "📱 App bundle size: $(du -h build/app/outputs/bundle/release/app-release.aab | cut -f1)"
          echo "🔐 Build verification completed successfully!"

      # Upload app bundle artifact
      - name: "📤 Upload app bundle artifact"
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 1
          
      - name: "📤 Upload modified pubspec.yaml"
        uses: actions/upload-artifact@v4
        with:
          name: modified-pubspec
          path: pubspec.yaml

  # STEP 3: Version Control
  version-control:
    name: Version Control
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      commits: ${{ steps.collect_commits.outputs.commits }}
    steps:
      - name: "🔧 Checkout code"
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: "⚙️ Configure Git"
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
      - name: "📥 Download modified pubspec.yaml"
        uses: actions/download-artifact@v4
        with:
          name: modified-pubspec
          path: ./

      - name: "📝 Collect commits since last tag"
        id: collect_commits
        run: |
          # Get the last tag
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          
          if [ -n "$LAST_TAG" ]; then
            echo "Last tag: $LAST_TAG"
            # Get commits since last tag and escape properly for GITHUB_OUTPUT
            git log --oneline --no-merges ${LAST_TAG}..HEAD | sed 's/^/- /' > commits.txt
            echo "commits<<EOF" >> $GITHUB_OUTPUT
            cat commits.txt >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            echo "✅ Collected commits from $LAST_TAG to HEAD"
            rm -f commits.txt
          else
            echo "No previous tags found, getting all commits"
            # Get all commits if no previous tags
            git log --oneline --no-merges | sed 's/^/- /' > commits.txt
            echo "commits<<EOF" >> $GITHUB_OUTPUT
            cat commits.txt >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            echo "✅ Collected all commits"
            rm -f commits.txt
          fi
          
      - name: "💾 Commit version update"
        run: |
          git add pubspec.yaml
          git commit -m "chore: increment version to ${{ needs.build.outputs.version }} [skip ci]" || echo "No changes to commit"
          
      - name: "🚀 Push version update"
        run: |
          git pull origin main --no-rebase -n
          git push --force-with-lease origin main
          echo "✅ Version update pushed to remote successfully"

      - name: "🏷️ Create and push tag"
        run: |
          git tag "${{ needs.build.outputs.tag_name }}"
          git push --force-with-lease origin "${{ needs.build.outputs.tag_name }}"
          echo "✅ Tag ${{ needs.build.outputs.tag_name }} created and pushed successfully"

  # STEP 4: Create GitHub Release
  release:
    name: Release
    needs: [test, build, version-control]
    runs-on: ubuntu-latest
    
    steps:
      - name: "🔧 Checkout code"
        uses: actions/checkout@v4

      - name: "📥 Download build artifacts"
        uses: actions/download-artifact@v4
        with:
          name: app-release-bundle
          path: ./
          
      - name: "🏷️ Rename app bundle for release"
        run: |
          mv app-release.aab "tune-tangler-${{ needs.build.outputs.version }}.aab"
          echo "✅ App bundle renamed to: tune-tangler-${{ needs.build.outputs.version }}.aab"

      - name: "📝 Generate release body from template"
        id: generate_release_body
        run: |
          # Use awk for better separator handling
          awk -v repo="${{ github.repository }}" \
              -v run_id="${{ github.run_id }}" \
              -v run_number="${{ github.run_number }}" \
              -v proj_name="$(echo "${{ github.repository }}" | sed 's/.*\///' | sed 's/-/ /g' | sed 's/\b\w/\U&/g')" \
              -v version="${{ needs.build.outputs.version }}" \
              -v flutter_version="${{ env.FLUTTER_VERSION }}" \
              -v java_version="${{ env.JAVA_VERSION }}" \
              -v java_distribution="${{ env.JAVA_DISTRIBUTION }}" \
              '{gsub(/{{ repository }}/, repo); 
                gsub(/{{ run_id }}/, run_id); 
                gsub(/{{ run_number }}/, run_number); 
                gsub(/{{ project_name }}/, proj_name); 
                gsub(/{{ version }}/, version); 
                gsub(/{{ commits }}/, ""); 
                gsub(/{{ FLUTTER_VERSION }}/, flutter_version); 
                gsub(/{{ JAVA_VERSION }}/, java_version); 
                gsub(/{{ JAVA_DISTRIBUTION }}/, java_distribution); 
                print}' .github/templates/release.md > RELEASE_NOTE.md
          
          # Check if template contained {{ commits }} and handle it
          if grep -q "{{ commits }}" .github/templates/release.md; then
            echo "📝 Template contains {{ commits }} placeholder - adding commits at the end"
            echo "${{ needs.version-control.outputs.commits }}" >> RELEASE_NOTE.md
          else
            echo "📝 Template does not contain {{ commits }} placeholder - keeping as is"
          fi
          
          echo "✅ Release body generated from template"

      - name: "🚀 Create GitHub Release"
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.build.outputs.tag_name }}
          name: Release ${{ needs.build.outputs.tag_name }}
          body_path: RELEASE_NOTE.md
          files: tune-tangler-${{ needs.build.outputs.version }}.aab
          draft: false
          prerelease: false
