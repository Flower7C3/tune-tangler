name: Build & Release Workflow

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write
  pull-requests: write

# Version variables for dependencies
env:
  FLUTTER_CHANNEL: 'stable'
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'zulu'

jobs:

  # STEP 1: Test
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: "🔧 Checkout code"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "📲 Setup Flutter"
        uses: ./.github/actions/setup-flutter
        with:
          flutter_channel: ${{ env.FLUTTER_CHANNEL }}
          with_dependencies: true
          with_localization: false

      - name: "🧪 Run tests"
        uses: ./.github/actions/flutter-test
  
  # STEP 2: Build
  build:
    name: Build
    needs: [ test ]
    runs-on: ubuntu-latest
    
    outputs:
      version: ${{ steps.increment_version.outputs.version }}
      tag_name: ${{ steps.increment_version.outputs.tag_name }}

    steps:
      - name: "🔧 Checkout code"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "📲 Setup Flutter"
        uses: ./.github/actions/setup-flutter
        with:
          flutter_channel: ${{ env.FLUTTER_CHANNEL }}
          with_dependencies: true
          with_localization: true

      - name: "☕️ Setup Java"
        uses: ./.github/actions/setup-java
        with:
          java_version: ${{ env.JAVA_VERSION }}
          java_distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: "🔐 Decode keystore"
        id: android_keystore
        uses: timheuer/base64-to-file@v1.2
        with:
          fileName: tune-tangler-release-key.jks
          encodedString: ${{ secrets.KEYSTORE_BASE64 }}
    
      - name: "🔐 Create key.properties"
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "storeFile=${{ steps.android_keystore.outputs.filePath }}" > android/key.properties
          echo "storePassword=$KEYSTORE_PASSWORD" >> android/key.properties
          echo "keyPassword=$KEY_PASSWORD" >> android/key.properties
          echo "keyAlias=$KEY_ALIAS" >> android/key.properties

      - name: "🏷️ Increment version and set tag"
        id: increment_version
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_VERSION_LINE=$(grep '^version:' pubspec.yaml | head -1)
          CURRENT_VERSION=$(echo "$CURRENT_VERSION_LINE" | sed 's/.*version: //')
          BASE_VERSION=$(echo "$CURRENT_VERSION" | cut -d'+' -f1)
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE_VERSION"
          if [[ -z "${PATCH:-}" ]]; then
            PATCH=0
          fi
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}"
          # Update pubspec.yaml
          sed -i.bak -E "s/^version: .*/version: ${NEW_VERSION}/" pubspec.yaml
          rm -f pubspec.yaml.bak
          echo "version=${NEW_VERSION}" >> $GITHUB_OUTPUT
          echo "tag_name=v${NEW_VERSION}-build-${{ github.run_number }}" >> $GITHUB_OUTPUT
          echo "✅ Version bumped to ${NEW_VERSION}"

      # This step builds the APK for your Flutter application in release mode.
      - name: "🏗️ Build APK"
        run: flutter build apk --split-per-abi --build-number=${{ github.run_number }}

      # This step builds the Android App Bundle (AAB) for your Flutter application
      - name: "🏗️ Build App Bundle"
        run: |
          export GRADLE_OPTS="-Dorg.gradle.daemon=true -Dorg.gradle.parallel=true -Dorg.gradle.jvmargs=-Xmx4g"
          flutter build appbundle --build-number=${{ github.run_number }}

      # Verify app bundle signature
      - name: "🔐 Verify build"
        run: |
          # Verify app bundle signature
          echo "🔍 Verifying app bundle signature..."
          
          # Check if app bundle exists
          if [ ! -f "build/app/outputs/bundle/release/app-release.aab" ]; then
            echo "❌ App bundle not found!"
            exit 1
          fi
          
          # Verify signature with jarsigner
          jarsigner -verify -verbose -certs build/app/outputs/bundle/release/app-release.aab
          
          if [ $? -eq 0 ]; then
            echo "✅ App bundle signature verified successfully!"
          else
            echo "❌ App bundle signature verification failed!"
            exit 1
          fi
          
          echo "📱 App bundle size: $(du -h build/app/outputs/bundle/release/app-release.aab | cut -f1)"
          echo "🔐 Build verification completed successfully!"

      # Upload app bundle artifact
      - name: "📤 Upload app bundle artifact"
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
            build/app/outputs/bundle/release/app-release.aab
          retention-days: 1
          
      - name: "📤 Upload modified pubspec.yaml"
        uses: actions/upload-artifact@v4
        with:
          name: modified-pubspec
          path: pubspec.yaml

  # STEP 3: Version Control
  version-control:
    name: Version Control
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      commits: ${{ steps.collect_commits.outputs.commits }}
    steps:
      - name: "🔧 Checkout code"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "⚙️ Configure Git"
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
      - name: "📥 Download modified pubspec.yaml"
        uses: actions/download-artifact@v4
        with:
          name: modified-pubspec
          path: ./

      - name: "💾 Commit version update"
        run: |
          if git status --porcelain | grep -q .; then
            git add pubspec.yaml
            git commit -m "chore: increment version to ${{ needs.build.outputs.version }} [skip ci]"
            echo "✅ Version update committed successfully"
          else
            echo "❌ No changes to commit - stopping workflow"
            exit 1
          fi

      - name: "🚀 Push version update"
        run: |
          git pull origin main --no-rebase -n
          git push --force-with-lease origin main
          echo "✅ Version update pushed to remote successfully"

      - name: "📝 Collect commits since last tag"
        id: collect_commits
        run: |
          # Get the last tag
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          
          if [ -n "$LAST_TAG" ]; then
            echo "Last tag: $LAST_TAG"
            # Get commits since last tag and escape properly for GITHUB_OUTPUT
            git log --oneline --no-merges ${LAST_TAG}..HEAD | sed 's/^/- /' > commits.txt
            echo "commits<<EOF" >> $GITHUB_OUTPUT
            cat commits.txt >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            echo "✅ Collected commits from $LAST_TAG to HEAD"
            rm -f commits.txt
          else
            echo "No previous tags found, getting all commits"
            # Get all commits if no previous tags
            git log --oneline --no-merges | sed 's/^/- /' > commits.txt
            echo "commits<<EOF" >> $GITHUB_OUTPUT
            cat commits.txt >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            echo "✅ Collected all commits"
            rm -f commits.txt
          fi

      - name: "🏷️ Create and push tag"
        run: |
          git tag "${{ needs.build.outputs.tag_name }}"
          git push --force-with-lease origin "${{ needs.build.outputs.tag_name }}"
          echo "✅ Tag ${{ needs.build.outputs.tag_name }} created and pushed successfully"

  # STEP 4: Create GitHub Release
  release:
    name: Release
    needs: [test, build, version-control]
    runs-on: ubuntu-latest
    
    steps:
      - name: "🔧 Checkout code"
        uses: actions/checkout@v4

      - name: "📥 Download build artifacts"
        uses: actions/download-artifact@v4
        with:
          name: app-release-bundle
          path: ./
          
      - name: "🏷️ Rename app bundle for release"
        run: |
          mv flutter-apk/app-arm64-v8a-release.apk "tune-tangler-${{ needs.build.outputs.version }}-arm64-v8a.apk"
          mv flutter-apk/app-armeabi-v7a-release.apk "tune-tangler-${{ needs.build.outputs.version }}-armeabi-v7a.apk"
          mv flutter-apk/app-x86_64-release.apk "tune-tangler-${{ needs.build.outputs.version }}-x86_64.apk"
          mv bundle/release/app-release.aab "tune-tangler-${{ needs.build.outputs.version }}.aab"
          echo "✅ App bundle renamed to: tune-tangler-${{ needs.build.outputs.version }}.aab"

      - name: "📝 Generate release body from template"
        id: generate_release_body
        run: |
          # Use awk for better separator handling
          awk -v github_repository="${{ github.repository }}" \
              -v github_run_id="${{ github.run_id }}" \
              -v github_run_number="${{ github.run_number }}" \
              -v repository_tag_name="${{ needs.build.outputs.tag_name }}" \
              -v proj_name="$(echo "${{ github.repository }}" | sed 's/.*\///' | sed 's/-/ /g' | sed 's/\b\w/\U&/g')" \
              -v build_version="${{ needs.build.outputs.version }}" \
              -v flutter_version="$(curl -s https://storage.googleapis.com/flutter_infra_release/releases/releases_linux.json | jq -r '.releases[] | select(.channel=="stable") | .version' | head -1)" \
              -v java_version="${{ env.JAVA_VERSION }}" \
              -v java_distribution="${{ env.JAVA_DISTRIBUTION }}" \
              '{gsub(/{{ GITHUB_REPOSITORY }}/, github_repository); 
                gsub(/{{ GITHUB_RUN_ID }}/, github_run_id); 
                gsub(/{{ GITHUB_RUN_NUMBER }}/, github_run_number); 
                gsub(/{{ REPOSITORY_TAG_NAME }}/, repository_tag_name); 
                gsub(/{{ PROJECT_NAME }}/, proj_name); 
                gsub(/{{ APP_BUILD_VERSION }}/, build_version); 
                gsub(/{{ REPOSITORY_COMMITS }}/, ""); 
                gsub(/{{ FLUTTER_VERSION }}/, flutter_version); 
                gsub(/{{ JAVA_VERSION }}/, java_version); 
                gsub(/{{ JAVA_DISTRIBUTION }}/, java_distribution); 
                print}' .github/templates/release.md > RELEASE_NOTE.md
          
          # Check if template contained {{ REPOSITORY_COMMITS }} and handle it
          if grep -q "{{ REPOSITORY_COMMITS }}" .github/templates/release.md; then
            echo "📝 Template contains {{ REPOSITORY_COMMITS }} placeholder - adding commits at the end"
            echo "${{ needs.version-control.outputs.commits }}" >> RELEASE_NOTE.md
          else
            echo "📝 Template does not contain {{ REPOSITORY_COMMITS }} placeholder - keeping as is"
          fi
          
          echo "✅ Release body generated from template"

      - name: "🚀 Create GitHub Release"
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.build.outputs.tag_name }}
          name: Release ${{ needs.build.outputs.tag_name }}
          body_path: RELEASE_NOTE.md
          files: |
            tune-tangler-${{ needs.build.outputs.version }}-arm64-v8a.apk
            tune-tangler-${{ needs.build.outputs.version }}-armeabi-v7a.apk
            tune-tangler-${{ needs.build.outputs.version }}-x86_64.apk
            tune-tangler-${{ needs.build.outputs.version }}.aab
          draft: false
          prerelease: false
