name: Release Workflow

on:
  workflow_dispatch:  # Only manual trigger - no automatic runs

permissions:
  contents: write

jobs:
  # STEP 1: Build and Release (Matrix Strategy)
  build-and-release:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Matrix setup + zadania w jednym
          - os: ubuntu-latest
            flutter-version: '3.35.1'
            java-version: '17'
            task: analyze
            command: flutter analyze
            step_name: "Analyze code"
          - os: ubuntu-latest
            flutter-version: '3.35.1'
            java-version: '17'
            task: test
            command: flutter test
            step_name: "Run tests"
          - os: ubuntu-latest
            flutter-version: '3.35.1'
            java-version: '17'
            task: localization
            command: flutter gen-l10n
            step_name: "Generate localization files"
          - os: ubuntu-latest
            flutter-version: '3.35.1'
            java-version: '17'
            task: build
            command: flutter build apk --release
            step_name: "Build APK"
    
    steps:
      - name: "🔧 Checkout code"
        uses: actions/checkout@v4
        
      # Setup Flutter (z matrix)
      - name: "🔧 Setup Flutter ${{ matrix.flutter-version }}"
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter-version }}
          channel: 'stable'
          
      # Setup Java (z matrix)
      - name: "🔧 Setup Java ${{ matrix.java-version }}"
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ matrix.java-version }}
          cache: 'gradle'
          
      # Cache dependencies
      - name: " Cache dependencies"
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
          key: ${{ matrix.os }}-flutter-${{ matrix.flutter-version }}-java-${{ matrix.java-version }}-${{ hashFiles('**/pubspec.lock') }}
          
      - name: " Get dependencies"
        run: flutter pub get
        
      # Wykonanie zadania (z matrix)
      - name: " ${{ matrix.step_name }}"
        run: ${{ matrix.command }}
        
      # Upload APK artifact (tylko dla build)
      - name: " Upload APK artifact"
        if: matrix.task == 'build'
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          
      # Version management (tylko dla build)
      - name: "🏷️ Increment version"
        if: matrix.task == 'build'
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/.*version: //')
          VERSION_ONLY=$(echo $VERSION | sed 's/+.*//')
          BUILD_NUM=$(echo $VERSION | sed 's/.*+//')
          
          # Split version into major.minor.patch
          MAJOR=$(echo $VERSION_ONLY | cut -d. -f1)
          MINOR=$(echo $VERSION_ONLY | cut -d. -f2)
          PATCH=$(echo $VERSION_ONLY | cut -d. -f3)
          
          # Increment both patch and build
          NEW_PATCH=$((PATCH + 1))
          NEW_BUILD_NUM=$((BUILD_NUM + 1))
          NEW_VERSION_ONLY="$MAJOR.$MINOR.$NEW_PATCH"
          NEW_VERSION="$NEW_VERSION_ONLY+$NEW_BUILD_NUM"
          
          echo "Current version: $VERSION"
          echo "New version: $NEW_VERSION (patch: $PATCH->$NEW_PATCH, build: $BUILD_NUM->$NEW_BUILD_NUM)"
          
          # Update pubspec.yaml
          sed -i "s/^version: .*/version: $NEW_VERSION/" pubspec.yaml
          
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "version_only=$NEW_VERSION_ONLY" >> $GITHUB_OUTPUT
          echo "build_num=$NEW_BUILD_NUM" >> $GITHUB_OUTPUT
          
      # Commit version (tylko dla build)
      - name: "🏷️ Commit version update"
        if: matrix.task == 'build'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add pubspec.yaml
          git commit -m "chore: increment version to ${{ steps.version.outputs.version }} [skip ci]" || echo "No changes to commit"
          
      # Create and push tag (tylko dla build)
      - name: "🏷️ Create and push tag"
        if: matrix.task == 'build'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git tag "v${{ steps.version.outputs.version_only }}"
          git push origin "v${{ steps.version.outputs.version_only }}"
          echo "Created and pushed tag v${{ steps.version.outputs.version_only }}"
          
      # Create GitHub Release (tylko dla build)
      - name: "🚀 Create GitHub Release"
        if: matrix.task == 'build'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version_only }}
          name: Release ${{ steps.version.outputs.version }}
          body: |
            ## Release ${{ steps.version.outputs.version }}
            
            ### 🔧 Build Info
            - **Flutter Version:** ${{ matrix.flutter-version }}
            - **Build Number:** ${{ github.run_number }}
            - **Commit SHA:** ${{ github.sha }}
            
            ### 📋 Release Notes
            - **Build Status:** ✅ Successfully built and tested
            - **APK Size:** Ready for download
            - **Compatibility:** Android devices (API 21+)
            - **Installation:** Direct APK installation supported
            
            ### 🔄 Recent Changes
            - **Latest commit:** ${{ github.sha }}
            - **Workflow run:** [${{ github.repository }}/actions/runs/${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          files: build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false
