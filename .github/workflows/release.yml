name: Release Workflow

on:
  workflow_dispatch:  # Only manual trigger - no automatic runs

permissions:
  contents: write
    
# Version variables for dependencies
env:
  FLUTTER_VERSION: '3.35.1'
  FLUTTER_CHANNEL: 'stable'
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'zulu'

jobs:

  # STEP 1: Test
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: "🔧 Checkout code"
        uses: actions/checkout@v4
        
      - name: "🔧 Setup Environment"
        uses: ./.github/actions/setup-flutter
        with:
          flutter_version: ${{ env.FLUTTER_VERSION }}
          flutter_channel: ${{ env.FLUTTER_CHANNEL }}
          with_dependencies: true
          with_localization: false

      - name: "🔧 Run tests"
        uses: ./.github/actions/flutter-test
  
  # STEP 2: Build
  build:
    name: Build
    needs: test
    runs-on: ubuntu-latest
    
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag_name: ${{ steps.version.outputs.tag_name }}

    steps:
      - name: "🔧 Checkout code"
        uses: actions/checkout@v4
        
      - name: "🔧 Setup Environment"
        uses: ./.github/actions/setup-flutter
        with:
          flutter_version: ${{ env.FLUTTER_VERSION }}
          flutter_channel: ${{ env.FLUTTER_CHANNEL }}
          with_dependencies: true
          with_localization: true

      - name: "🔧 Setup Java"
        uses: ./.github/actions/setup-java
        with:
          java_version: ${{ env.JAVA_VERSION }}
          java_distribution: ${{ env.JAVA_DISTRIBUTION }}
  
      # Version management - BEFORE building
      - name: "🏷️ Increment version"
        id: version
        run: |
          CURRENT_VERSION=$(grep '^version:' pubspec.yaml | sed 's/.*version: //')
          echo "Current version: $CURRENT_VERSION"

          # Split version into major.minor.patch
          CURRENT_SEMANTIC_VERSION=$(echo $CURRENT_VERSION | sed 's/+.*//')
          CURRENT_MAJOR=$(echo $CURRENT_SEMANTIC_VERSION | cut -d. -f1)
          CURRENT_MINOR=$(echo $CURRENT_SEMANTIC_VERSION | cut -d. -f2)
          CURRENT_PATCH=$(echo $CURRENT_SEMANTIC_VERSION | cut -d. -f3)
          CURRENT_BUILD=$(echo $CURRENT_VERSION | sed 's/.*+//')          
          
          # Increment both patch and build
          NEW_MAJOR=$CURRENT_MAJOR
          NEW_MINOR=$CURRENT_MINOR
          NEW_PATCH=$((CURRENT_PATCH + 1))
          NEW_BUILD=$((CURRENT_BUILD + 1))

          # Create new version
          NEW_SEMANTIC_VERSION="$NEW_MAJOR.$NEW_MINOR.$NEW_PATCH"
          NEW_VERSION="$NEW_SEMANTIC_VERSION+$NEW_BUILD"
          
          # Output new version
          echo "New version: $NEW_VERSION"

          # Update pubspec.yaml
          sed -i "s/^version: .*/version: $NEW_VERSION/" pubspec.yaml
          
          # Output new version
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "tag_name=v$NEW_SEMANTIC_VERSION" >> $GITHUB_OUTPUT
          
      # Build APK with new version
      - name: "🏗️ Build APK"
        run: flutter build apk --release
        
      # Upload APK artifact
      - name: "📤 Upload APK artifact"
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 1
          
      # Upload modified pubspec.yaml for version-control job
      - name: "📤 Upload modified pubspec.yaml"
        uses: actions/upload-artifact@v4
        with:
          name: modified-pubspec
          path: pubspec.yaml

  # STEP 3: Version Control
  version-control:
    name: Version Control
    needs: [test, build]
    runs-on: ubuntu-latest
    
    outputs:
      commits: ${{ steps.commits.outputs.commits }}
    
    steps:
      - name: "🔧 Checkout code"
        uses: actions/checkout@v4
        
      # Download modified pubspec.yaml
      - name: "📥 Download modified pubspec.yaml"
        uses: actions/download-artifact@v4
        with:
          name: modified-pubspec
          path: ./
          
      # Git configuration
      - name: "⚙️ Configure Git"
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
      # Collect commits since last tag (BEFORE committing new version)
      - name: "📝 Collect commits since last tag"
        id: commits
        run: |
          # Get the last tag
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          
          if [ -n "$LAST_TAG" ]; then
            echo "Last tag: $LAST_TAG"
            # Get commits since last tag and escape properly for GITHUB_OUTPUT
            git log --oneline --no-merges ${LAST_TAG}..HEAD | sed 's/^/- /' > commits.txt
            echo "commits<<EOF" >> $GITHUB_OUTPUT
            cat commits.txt >> $GITHUB_OUTPUT
            echo "EOF"
            echo "✅ Collected commits from $LAST_TAG to HEAD"
          else
            echo "No previous tags found, getting all commits"
            # Get all commits if no previous tags
            git log --oneline --no-merges | sed 's/^/- /' > commits.txt
            echo "commits<<EOF" >> $GITHUB_OUTPUT
            cat commits.txt >> $GITHUB_OUTPUT
            echo "EOF"
            echo "✅ Collected all commits"
          fi
          
      # Commit version update
      - name: "🏷️ Commit version update"
        run: |
          git add pubspec.yaml
          git commit -m "chore: increment version to ${{ needs.build.outputs.version }} [skip ci]" || echo "No changes to commit"
          
      # Push version update to remote
      - name: "📤 Push version update"
        run: |
          git push origin master
          echo "✅ Version update pushed to remote successfully"
          
      # Create and push tag
      - name: "🏷️ Create and push tag"
        run: |
          git tag "${{ needs.build.outputs.tag_name }}"
          git push origin "${{ needs.build.outputs.tag_name }}"
          echo "✅ Tag ${{ needs.build.outputs.tag_name }} created and pushed successfully"

  # STEP 4: Create GitHub Release
  release:
    name: Release
    needs: [test, build, version-control]
    runs-on: ubuntu-latest
    
    steps:
      # Download the APK artifact
      - name: "📥 Download APK artifact"
        uses: actions/download-artifact@v4
        with:
          name: app-release
          path: ./
          
      # Rename APK for release
      - name: "🏷️ Rename APK for release"
        run: |
          mv app-release.apk "tune-tangler-${{ needs.build.outputs.version }}.apk"
          echo "✅ APK renamed to: tune-tangler-${{ needs.build.outputs.version }}.apk"
          
      # Create GitHub Release
      - name: "🚀 Create GitHub Release"
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.build.outputs.tag_name }}
          name: Release ${{ needs.build.outputs.version }}
          body: |          
            ### 🔧 Build Info
            - **Flutter Version:** ${{ env.FLUTTER_VERSION }}
            - **Java Version:** ${{ env.JAVA_VERSION }}/${{ env.JAVA_DISTRIBUTION }}
            - **Workflow run:** [${{ github.run_number }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            
            ### 📝 Changes since last release
            ${{ needs.version-control.outputs.commits }}            
          files: tune-tangler-${{ needs.build.outputs.version }}.apk
          draft: false
          prerelease: false
