name: Release Workflow

on:
  workflow_dispatch:  # Only manual trigger - no automatic runs
    inputs:
      mock_build:
        description: 'Use mock build for testing (faster)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  # STEP 1: Version Management and Build
  build:
    runs-on: ubuntu-latest
    
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag_name: ${{ steps.version.outputs.tag_name }}
      flutter_version: ${{ env.FLUTTER_VERSION }}
    
    # Version variables for dependencies
    env:
      FLUTTER_VERSION: '3.35.1'
      FLUTTER_CHANNEL: 'stable'
      JAVA_VERSION: '17'
      JAVA_DISTRIBUTION: 'zulu'
    
    steps:
      - name: "🔧 Checkout code"
        uses: actions/checkout@v4
        
      # Setup Flutter
      - name: "🔧 Setup Flutter"
        if: ${{ !inputs.mock_build }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          
      # Setup Java
      - name: "🔧 Setup Java"
        if: ${{ !inputs.mock_build }}
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          
      # Get Flutter dependencies
      - name: "📦 Get dependencies"
        if: ${{ !inputs.mock_build }}
        run: flutter pub get
        
      # WYKONANIE ZADAŃ (sekwencyjnie)
      - name: "🔍 Analyze code"
        if: ${{ !inputs.mock_build }}
        run: flutter analyze
        
      - name: "🧪 Run tests"
        if: ${{ !inputs.mock_build }}
        run: flutter test
        
      - name: "🌐 Generate localization files"
        if: ${{ !inputs.mock_build }}
        run: flutter gen-l10n
        
      # Version management - BEFORE building
      - name: "🏷️ Increment version"
        id: version
        run: |
          CURRENT_VERSION=$(grep '^version:' pubspec.yaml | sed 's/.*version: //')
          echo "Current version: $CURRENT_VERSION"

          # Split version into major.minor.patch
          CURRENT_SEMANTIC_VERSION=$(echo $CURRENT_VERSION | sed 's/+.*//')
          CURRENT_MAJOR=$(echo $CURRENT_SEMANTIC_VERSION | cut -d. -f1)
          CURRENT_MINOR=$(echo $CURRENT_SEMANTIC_VERSION | cut -d. -f2)
          CURRENT_PATCH=$(echo $CURRENT_SEMANTIC_VERSION | cut -d. -f3)
          CURRENT_BUILD=$(echo $CURRENT_VERSION | sed 's/.*+//')          
          
          # Increment both patch and build
          NEW_MAJOR=$CURRENT_MAJOR
          NEW_MINOR=$CURRENT_MINOR
          NEW_PATCH=$((CURRENT_PATCH + 1))
          NEW_BUILD=$((CURRENT_BUILD + 1))

          # Create new version
          NEW_SEMANTIC_VERSION="$NEW_MAJOR.$NEW_MINOR.$NEW_PATCH"
          NEW_VERSION="$NEW_SEMANTIC_VERSION+$NEW_BUILD"
          
          # Output new version
          echo "New version: $NEW_VERSION"

          # Update pubspec.yaml
          sed -i "s/^version: .*/version: $NEW_VERSION/" pubspec.yaml
          
          # Output new version
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "tag_name=v$NEW_SEMANTIC_VERSION" >> $GITHUB_OUTPUT
        
      # Build APK with new version
      - name: "🏗️ Build APK"
        if: ${{ !inputs.mock_build }}
        run: flutter build apk --release
        
      # Mock build step for testing (when mock_build is enabled)
      - name: "🏗️ Mock build step (testing only)"
        if: ${{ inputs.mock_build }}
        run: |
          echo "🚀 Mock build step - simulating APK build for testing purposes"
          echo "📱 This would normally build the APK, but we're just testing the workflow"
          echo "⏱️  Simulating build time..."
          sleep 5
          echo "✅ Mock build completed successfully!"
          echo "📦 APK would be generated at: build/app/outputs/flutter-apk/app-release.apk"
          echo "📊 Build size: ~15-25 MB (estimated)"
          echo "🔧 Flutter version used: ${{ env.FLUTTER_VERSION }}"
          echo "☕ Java version used: ${{ env.JAVA_VERSION }}"
          
          # Create mock APK file for artifact upload
          mkdir -p build/app/outputs/flutter-apk/
          echo "Mock APK for testing - created at $(date)" > build/app/outputs/flutter-apk/app-release.apk
        
      # Upload APK artifact
      - name: "📤 Upload APK artifact"
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          
      # Upload modified pubspec.yaml for version-control job
      - name: "📤 Upload modified pubspec.yaml"
        uses: actions/upload-artifact@v4
        with:
          name: modified-pubspec
          path: pubspec.yaml

  # STEP 2: Version Control (commit and tag using modified pubspec.yaml)
  version-control:
    needs: build
    runs-on: ubuntu-latest
    
    steps:
      - name: "🔧 Checkout code"
        uses: actions/checkout@v4
        
      # Download modified pubspec.yaml
      - name: "📥 Download modified pubspec.yaml"
        uses: actions/download-artifact@v4
        with:
          name: modified-pubspec
          path: ./
          
      # Commit version update
      - name: "🏷️ Commit version update"
        if: ${{ !inputs.mock_build }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add pubspec.yaml
          git commit -m "chore: increment version to ${{ needs.build.outputs.version }} [skip ci]" || echo "No changes to commit"
          
      # Create and push tag
      - name: "🏷️ Create and push tag"
        if: ${{ !inputs.mock_build }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git tag "${{ needs.build.outputs.tag_name }}"
          git push origin "${{ needs.build.outputs.tag_name }}"
          echo "Created and pushed tag ${{ needs.build.outputs.tag_name }}"
      
      # Mock version-control step for testing (when mock_build is enabled)
      - name: "🏷️ Mock version-control step (testing only)"
        if: ${{ inputs.mock_build }}
        run: |
          echo "🚀 Mock version-control step - simulating version control for testing purposes"
          echo "📦 This would normally commit and push the version tag ${{ needs.build.outputs.tag_name }}, but we're just testing the workflow"
          sleep 5
          echo "✅ Mock version-control completed successfully!"          

  # STEP 3: Create GitHub Release
  create-release:
    needs: [build, version-control]
    runs-on: ubuntu-latest
    
    steps:
      # Download the APK artifact
      - name: "📥 Download APK artifact"
        uses: actions/download-artifact@v4
        with:
          name: app-release
          path: ./
          
      # Create GitHub Release
      - name: "🚀 Create GitHub Release"
        if: ${{ !inputs.mock_build }}
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.build.outputs.tag_name }}
          name: Release ${{ needs.build.outputs.version }}
          body: |
            ## Release ${{ needs.build.outputs.version }}
            
            ### 🔧 Build Info
            - **Flutter Version:** ${{ needs.build.outputs.flutter_version }}
            - **Build Number:** ${{ github.run_number }}
            - **Commit SHA:** ${{ github.sha }}

            ### 🔄 Recent Changes
            - **Latest commit:** ${{ github.sha }}
            - **Workflow run:** [${{ github.repository }}/actions/runs/${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          files: app-release.apk
          draft: false
          prerelease: false

      # Mock create-release step for testing (when mock_build is enabled)
      - name: "🚀 Mock create-release step (testing only)"
        if: ${{ inputs.mock_build }}
        run: |
          echo "🚀 Mock create-release step - simulating GitHub release for testing purposes"
          echo "📦 This would normally create a GitHub release ${{ needs.build.outputs.version }}, but we're just testing the workflow"
          echo ""
            
          echo "### 🔧 Build Info"
          echo " - **Flutter Version:** ${{ needs.build.outputs.flutter_version }}"
          echo " - **Build Number:** ${{ github.run_number }}"
          echo " - **Commit SHA:** ${{ github.sha }}"
          echo ""

          echo "### 🔄 Recent Changes"
          echo " - **Latest commit:** ${{ github.sha }}"
          echo " - **Workflow run:** [${{ github.repository }}/actions/runs/${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"

          echo "✅ Mock create-release completed successfully!"
