# On push to main: run `test.yml` (reusable), then set pubspec to MAJOR.MINOR.PATCH+GITHUB_RUN_NUMBER (PATCH bump when version: unchanged in that push), commit + tag.
# `paths-ignore`: keep in sync with `test.yml` (PR workflow). No hardcoded org/repo slugs — uses git + pubspec only.
name: Version & tag (main)

on:
  push:
    branches: [main]
    paths-ignore:
      - '.idea/**'
      - '.vscode/**'
      - '*.iml'
      - '.githooks/**'
      - '.github/**'
      - '.markdownlint.json'
      - '.metadata'
      - 'analysis_options.yaml'
      - 'devtools_options.yaml'
      - 'l10n.yaml'
      - 'docs/**'
      - 'assets/png/**'
      - 'assets/svg/**'
      - 'fastlane/metadata/**'
      - 'LICENSE'
      - 'README.md'
      - 'AGENTS.md'
      - '.cursor/**'
      - 'missing_translations.txt'
      - 'tools/**'
      - 'Makefile'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # Job id is the left segment in Actions UI: `<this id> / …` for reusable workflows (see `test.yml` job `test`).
  run_tests:
    if: ${{ github.event.head_commit == null || !contains(github.event.head_commit.message, '[skip ci]') }}
    uses: ./.github/workflows/test.yml

  version_tag:
    name: "📦 Version & tag"
    needs: [run_tests]
    if: ${{ github.event.head_commit == null || !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/pubspec-bump-tag-push
        with:
          checkout_token: ${{ github.token }}
          before_sha: ${{ github.event.before }}
          commit_suffix: ' [skip ci]'
          version_commit_prefix: 'chore: release '
          annotate_with_body: 'false'
          annotated_tag_message_template: 'Release '
          pubspec_path: 'pubspec.yaml'
