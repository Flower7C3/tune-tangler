# On push to main: run `test.yml` (reusable), then set pubspec to MAJOR.MINOR.PATCH+GITHUB_RUN_NUMBER (PATCH bump when version: unchanged in that push), commit + tag.
# `paths-ignore`: keep in sync with `test.yml` (PR workflow).
name: Version & tag (main)

on:
  push:
    branches: [main]
    paths-ignore:
      - '.idea/**'
      - '.vscode/**'
      - '*.iml'
      - '.githooks/**'
      - '.github/**'
      - '.markdownlint.json'
      - '.metadata'
      - 'analysis_options.yaml'
      - 'devtools_options.yaml'
      - 'l10n.yaml'
      - 'docs/**'
      - 'assets/png/**'
      - 'assets/svg/**'
      - 'fastlane/metadata/**'
      - 'LICENSE'
      - 'README.md'
      - 'AGENTS.md'
      - '.cursor/**'
      - 'missing_translations.txt'
      - 'tools/**'
      - 'Makefile'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # Job id is the left segment in Actions UI: `<this id> / …` for reusable workflows (see `test.yml` job `test`).
  run_tests:
    if: ${{ github.event.head_commit == null || !contains(github.event.head_commit.message, '[skip ci]') }}
    uses: ./.github/workflows/test.yml

  version_tag:
    name: "📦 Version & tag"
    needs: [run_tests]
    if: ${{ github.event.head_commit == null || !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: "🔧 Checkout code"
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: "👤 Configure Git identity"
        uses: ./.github/actions/git-config-github-actions-bot

      - name: "📈 Set version (PATCH bump or normalize) + build suffix"
        id: bump
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          RUN_NO: ${{ github.run_number }}
        run: |
          set -euo pipefail
          echo "do_tag=false" >> "$GITHUB_OUTPUT"
          # `github.event.before` is only set for `push`. Manual runs (`workflow_dispatch`) leave it empty —
          # use parent of checked-out HEAD so PATCH/build logic matches a one-commit window.
          BEFORE_EFFECTIVE="${BEFORE:-}"
          if [ -z "$BEFORE_EFFECTIVE" ] || [ "$BEFORE_EFFECTIVE" = "0000000000000000000000000000000000000000" ]; then
            if [ "${GITHUB_EVENT_NAME:-}" = "workflow_dispatch" ]; then
              BEFORE_EFFECTIVE=$(git rev-parse HEAD^ 2>/dev/null || true)
            fi
          fi
          if [ -z "$BEFORE_EFFECTIVE" ] || [ "$BEFORE_EFFECTIVE" = "0000000000000000000000000000000000000000" ]; then
            echo "No usable before-SHA; skip."
            exit 0
          fi
          if ! git cat-file -e "${BEFORE_EFFECTIVE}^{commit}" 2>/dev/null; then
            echo "before SHA not found; skip."
            exit 0
          fi
          cur=$(grep '^version:' pubspec.yaml | head -1 | sed -E 's/^version:[[:space:]]+//; s/[[:space:]]+$//')
          if git diff "$BEFORE_EFFECTIVE" "${GITHUB_SHA}" -- pubspec.yaml | grep -E '^[+-]version:' >/dev/null; then
            echo "pubspec version: line changed in this push — set base+build only (no PATCH bump)."
            base="${cur%%+*}"
          else
            echo "pubspec version: unchanged in push diff — bump PATCH, then +build."
            base="${cur%%+*}"
            if ! [[ "$base" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::pubspec version base must be MAJOR.MINOR.PATCH (got: ${cur})"
              exit 1
            fi
            IFS=. read -r MAJOR MINOR PATCH <<< "$base"
            PATCH=$((PATCH + 1))
            base="${MAJOR}.${MINOR}.${PATCH}"
          fi
          if ! [[ "$base" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::pubspec version base must be MAJOR.MINOR.PATCH (got base from: ${cur})"
            exit 1
          fi
          NEW="${base}+${RUN_NO}"
          if [ "$cur" = "$NEW" ]; then
            echo "pubspec already ${NEW}; nothing to commit."
            exit 0
          fi
          sed -i.bak -E "s/^version:.*/version: ${NEW}/" pubspec.yaml
          rm -f pubspec.yaml.bak
          if git diff --quiet pubspec.yaml; then
            echo "No pubspec change; exit."
            exit 0
          fi
          echo "do_tag=true" >> "$GITHUB_OUTPUT"

      # Inlined from former `pubspec-commit-tag-push` (commit [skip ci], push branch, annotated tag;
      # no changelog collection / job summary — same as previous `with:` flags).
      - name: "🏷️ Expect changed pubspec"
        if: steps.bump.outputs.do_tag == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if ! git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            echo "::error::This job requires an existing git checkout."
            exit 1
          fi
          if git diff --quiet -- pubspec.yaml; then
            echo "::error::pubspec.yaml is unchanged. Modify pubspec in this job before commit."
            exit 1
          fi

      - name: "🏷️ Detect pubspec version for tag"
        id: pubspec
        if: steps.bump.outputs.do_tag == 'true'
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(grep '^version:' pubspec.yaml | head -1 | sed -E 's/^version:[[:space:]]+//; s/[[:space:]]+$//')
          TAG="v${VERSION}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          if git diff --quiet pubspec.yaml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: "🏷️ Commit pubspec"
        if: ${{ steps.bump.outputs.do_tag == 'true' && steps.pubspec.outputs.changed == 'true' }}
        shell: bash
        env:
          COMMIT_SUFFIX: ' [skip ci]'
        run: |
          set -euo pipefail
          git add pubspec.yaml
          git commit -m "chore: release ${VERSION}${COMMIT_SUFFIX}"

      - name: "🏷️ Push branch"
        if: steps.bump.outputs.do_tag == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: "🏷️ Annotated tag and push tag"
        if: steps.bump.outputs.do_tag == 'true'
        shell: bash
        env:
          WITH_DESCRIPTION: 'false'
        run: |
          set -euo pipefail
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::error::Tag ${TAG} already exists locally."
            exit 1
          fi
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q .; then
            echo "::error::Tag ${TAG} already exists on origin."
            exit 1
          fi
          if [ "$WITH_DESCRIPTION" = "true" ]; then
            git tag -a "$TAG" -m "Release ${TAG}"
          else
            git tag -a "$TAG" -m ""
          fi
          git push origin "$TAG"
