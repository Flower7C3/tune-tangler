# Signed APK/AAB: checkout an existing tag → build → verify → GitHub Release (no tests; no pubspec reads/edits in CI).
name: Release on GitHub (APK/AAB files)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and release (e.g. v1.7.0+12). Create it on main first (pubspec workflow).'
        required: true
        type: string
      release_artifact_basename:
        description: >-
          Base name for APK/AAB filenames and the decoded keystore temp file (e.g. my-app → my-app-1.0.0+1-arm64-v8a.apk).
          Leave empty to use repository variable RELEASE_ARTIFACT_BASENAME, else github.event.repository.name.
        required: false
        default: ''
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.tag }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    name: '📦 Signed APK/AAB → GitHub Release'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/android-github-apk-aab-release
        with:
          tag: ${{ github.event.inputs.tag }}
          release_artifact_basename: ${{ github.event.inputs.release_artifact_basename }}
          release_artifact_basename_var: ${{ vars.RELEASE_ARTIFACT_BASENAME }}
          default_artifact_basename: ${{ github.event.repository.name }}
          flutter_channel: 'stable'
          java_version: '17'
          java_distribution: 'zulu'
          release_title_prefix: 'Release '
