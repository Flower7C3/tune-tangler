name: Setup Environment

on:
  workflow_call:
    inputs:
      flutter-version:
        required: false
        type: string
        default: '3.35.1'
      java-version:
        required: false
        type: string
        default: '17'

jobs:
  setup-environment:
    runs-on: ubuntu-latest
    outputs:
      flutter_version: ${{ steps.flutter-version.outputs.flutter_version }}
    
    steps:
      - name: "🔧 Checkout code"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
        
      - name: "🔧 Setup Flutter"
        id: flutter-setup
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter-version }}
          channel: 'stable'
        
      - name: "🔧 Setup Java"
        id: java-setup
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ inputs.java-version }}
          cache: 'gradle'
          
      - name: "🔧 Cache dependencies"
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
          key: ${{ runner.os }}-deps-${{ hashFiles('**/pubspec.lock', '**/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-deps-
            
      - name: "🔧 Get Flutter version"
        id: flutter-version
        run: |
          FLUTTER_VER=$(flutter --version | grep -o 'Flutter [0-9]\+\.[0-9]\+\.[0-9]\+' | head -1 | cut -d' ' -f2)
          echo "flutter_version=$FLUTTER_VER" >> $GITHUB_OUTPUT
          echo "Flutter version: $FLUTTER_VER"
          
      - name: "🔧 Debug environment"
        run: |
          echo "=== Environment Debug ==="
          echo "Flutter version:"
          flutter --version
          echo "Java version:"
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          echo "Current directory: $(pwd)"
          echo "Android directory contents:"
          ls -la android/
          echo "Gradle wrapper check:"
          if [ -f "android/gradlew" ]; then
            echo "gradlew exists"
            cd android && ./gradlew --version
            cd ..
          else
            echo "gradlew not found, checking gradle wrapper:"
            ls -la android/gradle/wrapper/ || echo "gradle/wrapper not found"
          fi
          echo "========================"
          
      - name: "🔧 Mark setup as ready"
        run: |
          echo "ready=true" >> $GITHUB_OUTPUT
