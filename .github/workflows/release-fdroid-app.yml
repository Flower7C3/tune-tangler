# F-Droid: open/update fdroiddata MR for an existing tag or branch (no pubspec edits, commits, or tags here — those come from main / your git client).
name: Release on F-Droid (via MR)

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: 'Existing tag or branch (e.g. v1.7.0+12) — commit must match what you want in the MR'
        required: true
        type: string
      gitlab_stage:
        description: >-
          push_for_ci: push metadata to your fdroiddata fork only (GitLab CI on the branch).
          open_draft_mr: open a Draft MR + upstream checklist (same target_ref) after CI is green.
          push_and_open_draft_mr: push then open Draft MR in one run (convenience).
        required: true
        type: choice
        default: push_for_ci
        options:
          - push_for_ci
          - open_draft_mr
          - push_and_open_draft_mr

concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.target_ref }}-${{ github.event.inputs.gitlab_stage }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fdroid_metadata:
    name: "🦊 F-Droid MR (fdroiddata)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
      GITLAB_FORK_PROJECT_ID: ${{ vars.GITLAB_FORK_PROJECT_ID }}
    steps:
      - name: "🔧 Checkout ref"
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.target_ref }}
          fetch-depth: 0
      - name: "Resolve commit SHA"
        id: meta
        shell: bash
        run: echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: "🦊 Publish fdroiddata MR"
        uses: ./.github/actions/fdroid-metadata-mr
        with:
          commit_sha: ${{ steps.meta.outputs.commit_sha }}
          ref_name: ${{ github.event.inputs.target_ref }}
          version_override: ''
          flutter_version: ${{ vars.FDROID_FLUTTER_VERSION }}
          metadata_source_branch: ${{ vars.FDROID_METADATA_SOURCE_BRANCH }}
          gitlab_stage: ${{ github.event.inputs.gitlab_stage }}
