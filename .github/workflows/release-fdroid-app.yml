# F-Droid: push metadata YAML to a versioned branch on your fdroiddata fork (branch only; upstream merge request is manual in GitLab).
name: F-Droid fork branch (fdroiddata)

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: >-
          Tag or branch (e.g. v1.7.0+12). Leave empty to use the latest tag reachable from the repo default branch.
        required: false
        default: ''
        type: string

concurrency:
  group: >-
    ${{ github.workflow }}-${{
      github.event.inputs.target_ref != '' && github.event.inputs.target_ref || 'latest-tag'
    }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fdroid_metadata:
    name: "🦊 F-Droid fork branch (fdroiddata)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
      GITLAB_FORK_PROJECT_ID: ${{ vars.GITLAB_FORK_PROJECT_ID }}
    steps:
      - name: "🔧 Checkout default branch (resolve ref)"
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          fetch-tags: true
      - name: "Resolve target ref"
        id: resolve
        env:
          REF_INPUT: ${{ github.event.inputs.target_ref }}
        shell: bash
        run: |
          set -euo pipefail
          TRIM=$(printf '%s' "${REF_INPUT:-}" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          if [ -n "$TRIM" ]; then
            echo "resolved_ref=$TRIM" >> "$GITHUB_OUTPUT"
            echo "Using explicit **target_ref**: \`$TRIM\`" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! TAG=$(git describe --tags --abbrev=0 2>/dev/null); then
            echo "::error::No **target_ref** and no tag found on the default branch (\`git describe --tags --abbrev=0\`). Set **target_ref** or push a release tag from main."
            exit 1
          fi
          echo "resolved_ref=$TAG" >> "$GITHUB_OUTPUT"
          echo "**target_ref** empty — using latest reachable tag: \`$TAG\`" >> "$GITHUB_STEP_SUMMARY"
      # Resolve target SHA without checking out the tag in this job: old tags lack `.github/actions/...`.
      # Reference the composite via `repo/path@default_branch` so GitHub loads `action.yml` from the
      # default branch, not from `$GITHUB_WORKSPACE` (see ./ path + checkout tag).
      - name: "Resolve commit SHA"
        id: meta
        shell: bash
        env:
          RESOLVED_REF: ${{ steps.resolve.outputs.resolved_ref }}
        run: |
          set -euo pipefail
          git fetch origin "$RESOLVED_REF" --depth=1
          echo "commit_sha=$(git rev-parse 'FETCH_HEAD^{commit}')" >> "$GITHUB_OUTPUT"
      - name: "🦊 Push fdroiddata fork branch"
        id: fdroid
        uses: ${{ github.repository }}/.github/actions/fdroid-gitlab-branch@${{ github.event.repository.default_branch }}
        with:
          commit_sha: ${{ steps.meta.outputs.commit_sha }}
          ref_name: ${{ steps.resolve.outputs.resolved_ref }}
          version_override: ''
          flutter_version: ${{ vars.FDROID_FLUTTER_VERSION }}
          robot_branch_prefix: ${{ vars.FDROID_ROBOT_BRANCH_PREFIX }}
          gitlab_branch: ${{ vars.FDROID_GITLAB_BRANCH }}
      - name: "🔗 GitLab branch link"
        shell: bash
        run: |
          echo "**Branch URL:** ${{ steps.fdroid.outputs.gitlab_tree_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::fdroiddata fork branch:: ${{ steps.fdroid.outputs.gitlab_tree_url }}"
