# F-Droid: push metadata YAML to a fixed-name branch on your fdroiddata fork (branch only; upstream merge request is manual in GitLab).
name: F-Droid fork branch (fdroiddata)

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: >-
          Tag or branch (e.g. v1.7.0+12). Leave empty to use the latest tag reachable from the repo default branch.
        required: false
        default: ''
        type: string

concurrency:
  group: >-
    ${{ github.workflow }}-${{
      github.event.inputs.target_ref != '' && github.event.inputs.target_ref || 'latest-tag'
    }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fdroid_metadata:
    name: "🦊 F-Droid fork branch (fdroiddata)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
      GITLAB_FORK_PROJECT_ID: ${{ vars.GITLAB_FORK_PROJECT_ID }}
    outputs:
      gitlab_tree_url: ${{ steps.fdroid.outputs.gitlab_tree_url }}
      gitlab_branch: ${{ steps.fdroid.outputs.gitlab_branch }}
      gitlab_compare_url: ${{ steps.fdroid.outputs.gitlab_compare_url }}
    steps:
      - uses: actions/checkout@v6

      - id: fdroid
        uses: ./.github/actions/publish-fdroid-gitlab-metadata
        with:
          target_ref: ${{ github.event.inputs.target_ref }}
          fdroid_metadata_path: ${{ vars.FDROID_METADATA_PATH }}
          fdroid_gitlab_branch: ${{ vars.FDROID_GITLAB_BRANCH }}
          fdroid_git_commit_subject_prefix: ${{ vars.FDROID_GIT_COMMIT_SUBJECT_PREFIX }}
          fdroid_gitlab_fork_parent_ref: ${{ vars.FDROID_GITLAB_FORK_PARENT_REF }}
          fdroid_gitlab_compare_base_ref: ${{ vars.FDROID_GITLAB_COMPARE_BASE_REF }}
