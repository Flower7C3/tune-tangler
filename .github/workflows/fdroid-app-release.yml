# F-Droid: test → pubspec +run → commit/tag → fdroiddata MR
name: F-Droid release (test, tag, MR)

on:
  workflow_dispatch:

concurrency:
  group: fdroid-app-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  test:
    name: "STEP 1 — 🧪 Test"
    runs-on: ubuntu-latest
    steps:
      - name: "🔧 Checkout"
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: "🧪 Flutter setup and tests"
        uses: ./.github/actions/checkout-flutter-test
        with:
          skip_checkout: 'true'
          flutter_channel: stable
          with_dependencies: 'true'
          with_localization: 'false'

  set_build_version_commit_tag:
    name: "STEP 2 — 📝 Version, commit & tag"
    needs: [test]
    runs-on: ubuntu-latest
    outputs:
      computed_version: ${{ steps.ct.outputs.computed_version }}
      commit_sha: ${{ steps.ct.outputs.commit_sha }}
      tag_name: ${{ steps.ct.outputs.tag_name }}
    steps:
      - name: "📝 Apply base+build to pubspec"
        id: suffix
        uses: ./.github/actions/pubspec-set-build-suffix
        with:
          run_number: ${{ github.run_number }}
          with_artifacts: "false"
          github_token: ${{ github.token }}
      - name: "🏷️ Commit, push branch, annotated tag"
        id: ct
        uses: ./.github/actions/pubspec-commit-tag-push
        with:
          with_artifacts: "false"
          with_description: "false"
          github_token: ${{ github.token }}

  fdroid_metadata:
    name: "STEP 3 — 🦊 F-Droid MR (fdroiddata)"
    needs: [set_build_version_commit_tag]
    runs-on: ubuntu-latest
    env:
      GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
      GITLAB_FORK_PROJECT_ID: ${{ vars.GITLAB_FORK_PROJECT_ID }}
    steps:
      - name: "🦊 Publish fdroiddata MR"
        uses: ./.github/actions/fdroid-metadata-mr
        with:
          commit_sha: ${{ needs.set_build_version_commit_tag.outputs.commit_sha }}
          ref_name: ${{ needs.set_build_version_commit_tag.outputs.tag_name }}
          version_override: ''
          flutter_version: ${{ vars.FDROID_FLUTTER_VERSION }}
