# One ABI Build entry — placeholders replaced by .github/actions/publish-fdroid-gitlab-metadata/publish_fdroid_gitlab_branch.py
# Aligned with fdroiddata templates/build-flutter.yml (srclib + pubspec flutter_sdk_version checkout).
versionName: __VERSION_NAME__
versionCode: __VERSION_CODE__
commit: __COMMIT_SHA__
output: build/app/outputs/flutter-apk/app-__ABI_APK_SUFFIX__-release.apk
srclibs:
  - flutter@stable
rm:
  - ios
  - linux
  - macos
  - windows
prebuild:
  - flutterVersion=$(sed -n -E 's/^flutter_sdk_version:\s*([0-9.]+)/\1/p' pubspec.yaml)
  - '[[ $flutterVersion ]]'
  - git -C $$flutter$$ checkout -f $flutterVersion
  - export PUB_CACHE=$(pwd)/.pub-cache
  - $$flutter$$/bin/flutter config --no-analytics
  - $$flutter$$/bin/flutter precache --android
  - $$flutter$$/bin/flutter pub get
scandelete:
  - .pub-cache
build:
  - export PUB_CACHE=$(pwd)/.pub-cache
  - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform="__TARGET_PLATFORM__"
