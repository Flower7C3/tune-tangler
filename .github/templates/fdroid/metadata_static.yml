# F-Droid fdroiddata bootstrap (Builds, Repo, License, …).
# MaintainerNotes: applied on every publish by .github/actions/publish-fdroid-gitlab-metadata/ (bootstrap + fork updates).
#
# Do NOT put Summary / Description / Name / AutoName here: those fields in the fdroiddata
# metadata YAML override Fastlane/Triple-T text from the app repo. Store copy lives under
# fastlane/metadata/android/<locale>/ (title, short_description, full_description, images/).
# This file is used only when metadata/pro.kwiatek.tune_tangler.yml does not exist on the fork yet.
#
# Adjust Repo / links if you fork under a different URL than below.
Categories:
  - Multimedia
License: MIT
AuthorName: Bartłomiej Jakub Kwiatek
WebSite: https://github.com/Flower7C3/tune-tangler
SourceCode: https://github.com/Flower7C3/tune-tangler
IssueTracker: https://github.com/Flower7C3/tune-tangler/issues

RepoType: git
Repo: https://github.com/Flower7C3/tune-tangler.git

Builds: []

MaintainerNotes: |
  MIT. Sonic (Apache 2.0) in android/app/src/main/java/sonic/.

  Build: Flutter srclib @stable, checkout `flutter_sdk_version` from pubspec.yaml; per-ABI APKs
  (--split-per-abi) with versionCode = pubspec build * 10 + {1,2,3} (see android/app/build.gradle).

  Listings (Summary/Description/screenshots): Fastlane layout in the app repo
  (fastlane/metadata/android/) — do not duplicate those keys in this YAML.

AutoUpdateMode: Version
UpdateCheckMode: Tags
VercodeOperation:
  - '%c * 10 + 1'
  - '%c * 10 + 2'
  - '%c * 10 + 3'
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
