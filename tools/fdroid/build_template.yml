# Jeden wpis pod Builds — placeholdery __*__ zamieniane przez publish_fdroid_mr.py
versionName: __VERSION_NAME__
versionCode: __VERSION_CODE__
commit: __COMMIT_SHA__
subdir: .
sudo:
  - apt-get update || apt-get update
  - apt-get install -y openjdk-17-jdk-headless curl ca-certificates
init:
  - export FLUTTER_VERSION=__FLUTTER_VERSION__
  - curl -fsSL -o /tmp/flutter-sdk.tar.xz "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
  - tar -C "$HOME" -xf /tmp/flutter-sdk.tar.xz
  - export PATH="$HOME/flutter/bin:$PATH"
  - flutter config --no-analytics
  - flutter precache --android
  - flutter --version
prebuild:
  - export PATH="$HOME/flutter/bin:$PATH"
  - flutter pub get
build:
  - export PATH="$HOME/flutter/bin:$PATH"
  - flutter build apk --release
output: build/app/outputs/flutter-apk/app-release-unsigned.apk
