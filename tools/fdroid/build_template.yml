# One Build entry — __*__ placeholders replaced by publish_fdroid_gitlab_branch.py
# Aligned with fdroiddata templates/build-flutter.yml (srclib, not tarball init).
versionName: __VERSION_NAME__
versionCode: __VERSION_CODE__
commit: __COMMIT_SHA__
output: build/app/outputs/flutter-apk/app-release.apk
srclibs:
  - flutter@__FLUTTER_VERSION__
rm:
  - ios
  - linux
  - macos
  - web
  - windows
prebuild:
  - echo "flutter.sdk=$$flutter$$" >> android/local.properties
  - export PUB_CACHE=$(pwd)/.pub-cache
  - $$flutter$$/bin/flutter config --no-analytics
  - $$flutter$$/bin/flutter precache --android
  - $$flutter$$/bin/flutter pub get
scandelete:
  - .pub-cache
build:
  - export PUB_CACHE=$(pwd)/.pub-cache
  - $$flutter$$/bin/flutter build apk --release
